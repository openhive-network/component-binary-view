include:
  # NODE_TEST_TOOLS_IMAGE (Node and pnpm) and .pnpm_install_with_catalog_fallback
  - project: 'hive/common-ci-configuration'
    ref: develop
    file: '/templates/npm_projects.gitlab-ci.yml'

stages:
  - build
  - deploy

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  # npm-common-config tracks common-ci-configuration's develop, whose pnpm catalogs
  # (pnpm-workspace.yaml) pin the versions of every catalog: dependency
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote

image: "${NODE_TEST_TOOLS_IMAGE}"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - node_modules/
    - .pnpm-store/

default:
  tags:
    - public-runner-docker

build:
  stage: build
  before_script:
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
    - !reference [.pnpm_install_with_catalog_fallback, script]
  script:
    - pnpm run build
    # package.json of dist-wc and dist-vue, which the examples install
    - pnpm run prepack
  artifacts:
    paths:
      - 'dist'
      - 'dist-vue'
      - 'dist-wc'
      - pnpm-lock.catalog-refreshed.yaml
    when: always
    expire_in: 1 week

examples:
  stage: build
  needs:
    - job: build
      artifacts: true
  parallel:
    matrix:
      - EXAMPLE: [next, nuxt, react, vue, vue-multiple-operations]
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    NUXT_TELEMETRY_DISABLED: "1"
  cache: []
  before_script:
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
    - cd "example/${EXAMPLE}"
    - !reference [.pnpm_install_with_catalog_fallback, script]
  script:
    - pnpm run build
  artifacts:
    paths:
      - pnpm-lock.catalog-refreshed.yaml
    when: always
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - echo "The site will be deployed to $CI_PAGES_URL"
  publish: dist
  artifacts:
    paths:
      - dist
  only:
    - main

publish:
  stage: deploy
  before_script:
    - pnpm config set store-dir "${CI_PROJECT_DIR}/.pnpm-store"
    - !reference [.pnpm_install_with_catalog_fallback, script]
  script:
    - echo "@hiveio:registry=https://gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > dist-vue/.npmrc
    - echo "//gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> dist-vue/.npmrc
    - echo "@hiveio:registry=https://gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > dist-wc/.npmrc
    - echo "//gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> dist-wc/.npmrc
    - npm run prepack
    - npm run publish
  needs:
    - job: build
      artifacts: true
  only:
    - main
