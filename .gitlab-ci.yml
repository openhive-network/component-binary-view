image: node:18

stages:
  - build
  - deploy

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - node_modules/
    - .pnpm-store/

default:
  tags:
    - public-runner-docker

build:
  stage: build
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.1.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install
  script:
    - npm run build
  artifacts:
    paths:
      - 'dist'
      - 'dist-vue'
      - 'dist-wc'
    when: always
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - echo "The site will be deployed to $CI_PAGES_URL"
  publish: dist
  artifacts:
    paths:
      - dist
  only:
    - main

publish:
  stage: deploy
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.1.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install
  script:
    - echo "@hiveio:registry=https://gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > dist-vue/.npmrc
    - echo "//gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> dist-vue/.npmrc
    - echo "@hiveio:registry=https://gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > dist-wc/.npmrc
    - echo "//gitlab.syncad.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> dist-wc/.npmrc
    - npm run prepack
    - npm run publish
  needs:
    - job: build
      artifacts: true
  only:
    - main
